name: DPR challenge software checks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dpr-challenge-ci.yml'
      - 'windows/agent/**'
      - 'android/app/src/main/java/com/focuswindow/client/profile/**'
      - 'tools/run-dpr-challenge.ps1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows host compile and driver-free DPI tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile host (never install FocusIdd)
        run: dotnet build windows/agent/FocusWindow.Agent/FocusWindow.Agent.csproj -c Release -p:Platform=x64 -warnaserror
      - name: Run unit and simulated tests (no display changes)
        run: dotnet test windows/agent/FocusWindow.Tests/FocusWindow.Tests.csproj -c Release --verbosity minimal
      - name: Windows PowerShell 5.1 wrapper smoke (plan-only; no driver needed)
        shell: pwsh
        run: |
          $exe = Resolve-Path '.\windows\agent\FocusWindow.Agent\bin\x64\Release\net8.0-windows\FocusWindow.Agent.exe'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\tools\run-dpr-challenge.ps1' -AgentExe $exe.Path
          if ($LASTEXITCODE -ne 0) { throw "PowerShell 5.1 runner returned exit $LASTEXITCODE" }

  android:
    name: Android DPR profile unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        continue-on-error: true
      - name: Install Android SDK
        run: |
          SDK_ROOT="/usr/local/lib/android/sdk"
          MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$MANAGER"
          "$MANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
      - name: Build and test Android without devices
        working-directory: android
        run: bash ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
