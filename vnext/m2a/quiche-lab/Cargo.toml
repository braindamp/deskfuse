[package]
name = "deskfuse-quiche-lab"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[[bin]]
name = "deskfuse-audio-worker"
path = "src/bin/deskfuse-audio-worker.rs"

[dependencies]
# Exact quiche release; cargo generates Cargo.lock on first dependency resolution.
quiche = "=0.30.0"
serde_json = "=1.0.142"

[lib]
crate-type = ["rlib", "cdylib"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_Networking_WinSock", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_System_IO"] }

[dev-dependencies]
rcgen = "=0.14.10"
tempfile = "3.23"
