name: vNext M1 native WASAPI capture build

on:
  push:
    branches:
      - feature/vnext-wp001-native-lab
    paths:
      - 'vnext/m1/**'
      - 'vnext/qualification/**'
      - '.github/workflows/vnext-m1-wasapi.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-capture:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Qualify streaming DFWC source/QPC parser against original record layout
        shell: pwsh
        run: python vnext/qualification/test_analyze_dfpcm.py
      - name: Assert local physical-run evidence evaluator fails closed
        shell: pwsh
        run: python vnext/qualification/test_evaluate_physical_audio.py
      - name: Qualify exact native WASAPI packet/QPC pairing report offline
        shell: pwsh
        run: python vnext/qualification/test_analyze_wasapi_qpc_pairs.py
      - name: Prove diagnostic stderr is not fatal but real receiver errors remain fatal in Windows PowerShell 5.1
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File vnext/qualification/test-invoke-native-audio.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 native stderr or exit-status regression failed' }
      - name: Statically parse physical qualification PowerShell (no devices contacted)
        shell: pwsh
        run: |
          $tokens = $null
          $errorsFound = $null
          foreach ($script in @(
            'vnext/qualification/run-physical-audio.ps1',
            'vnext/qualification/mark-audio-event.ps1',
            'vnext/qualification/build-audio-pair.ps1',
            'vnext/qualification/audio-ab.ps1',
            'vnext/qualification/invoke-native-audio.ps1',
            'vnext/qualification/test-invoke-native-audio.ps1'
          )) {
            $tokens = $null
            $errorsFound = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script).Path,
              [ref]$tokens, [ref]$errorsFound
            ) | Out-Null
            if ($errorsFound.Count -ne 0) { throw ($errorsFound | Out-String) }
          }
      - name: Configure native C++20 Windows capture
        shell: pwsh
        run: cmake -S vnext/m1 -B vnext/m1/build -G "Visual Studio 17 2022" -A x64
      - name: Build endpoint-selectable WASAPI adapter
        shell: pwsh
        run: cmake --build vnext/m1/build --config Release --parallel 2
