name: vNext M2a quiche Rust lab

on:
  push:
    branches:
      - feature/vnext-wp001-native-lab
    paths:
      - 'vnext/m2a/quiche-lab/**'
      - '.github/workflows/vnext-m2a-quiche.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quiche-test:
    name: quiche TLS and DATAGRAM (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install native prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build nasm clang
      - name: Install native prerequisites (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm --yes --no-progress
          $nasm = Get-ChildItem 'C:\Program Files\NASM' -ErrorAction SilentlyContinue
          if ($nasm) { $env:PATH = 'C:\Program Files\NASM;' + $env:PATH }
          if (-not (Get-Command nasm.exe -ErrorAction SilentlyContinue)) {
            throw 'NASM missing: BoringSSL cannot compile'
          }
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Install native prerequisites (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v nasm >/dev/null 2>&1; then brew install nasm; fi
          if ! command -v cmake >/dev/null 2>&1; then brew install cmake; fi
          echo "macOS architecture: $(uname -m)"
          nasm -v
          cmake --version | head -n 1
      - name: Select current Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version
      - name: Test Rust codec and authenticated QUIC handshake
        shell: bash
        run: cargo test --manifest-path vnext/m2a/quiche-lab/Cargo.toml --verbose -- --nocapture
