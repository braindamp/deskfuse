name: Unified DeskFuse software checks

on:
  push:
    branches: [main, 'integration/**', experiment/vnext-audio-latency]
    paths:
      - '.github/workflows/dpr-challenge-ci.yml'
      - 'windows/agent/**'
      - 'windows/native/**'
      - 'windows/audio/**'
      - 'windows/driver/**'
      - 'windows/shared/**'
      - 'windows/tools/**'
      - 'windows/security/**'
      - 'vnext/**'
      - 'tools/**'
      - 'plans/DeskFuse_One_Codebase_Integration_Implementation_Plan_2026-10-20.md'
      - 'android/**'
      - 'tests/protocol3/**'
      - 'tools/protocol3/**'
      - 'tools/run-dpr-challenge.ps1'
  pull_request:
    paths:
      - 'windows/agent/**'
      - 'windows/native/**'
      - 'windows/audio/**'
      - 'windows/driver/**'
      - 'windows/shared/**'
      - 'windows/tools/**'
      - 'windows/security/**'
      - 'vnext/**'
      - 'tools/**'
      - 'android/**'
      - 'tests/protocol3/**'
      - 'tools/protocol3/**'
      - '.github/workflows/dpr-challenge-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dpr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source, provenance and safety contracts (no devices)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source gates and build-receipt behavior
        run: |
          python tools/check-source-gates.py
          python -B -m unittest discover -s tools -p test_build_receipt.py -v
      - name: Prepared maintenance source restrictions (behavior runs on Windows)
        run: python tools/test-safety-gates.py --static-only

  windows:
    name: Windows host compile and driver-free DPI tests
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Snapshot actual source before builds
        run: python -B tools/build-receipt.py source --output out/provenance/windows-source.json
      - name: Record actual .NET toolchain
        run: python -B tools/build-receipt.py check --name dotnet-toolchain --kind toolchain --report out/provenance/dotnet.json --log out/provenance/dotnet.log -- dotnet --info
      - name: Build real MSVC x64 driver-host ABI contract (no driver install)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1
          if (-not $vsRoot) { throw 'MSVC x64 installation missing' }
          Import-Module (Join-Path $vsRoot 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vsRoot -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64' | Out-Null
          python -B tools/build-receipt.py check --name msvc-toolchain --kind toolchain --report out/provenance/msvc.json --log out/provenance/msvc.log -- powershell.exe -NoProfile -Command '(Get-Item (Get-Command cl.exe).Source).VersionInfo | Format-List FileName,FileVersion,ProductVersion; cmake --version; exit $LASTEXITCODE'
          if ($LASTEXITCODE -ne 0) { throw 'MSVC toolchain receipt failed' }
          python -B tools/build-receipt.py check --name driver-host-abi --kind test --report out/provenance/abi.json --log out/provenance/abi.log -- powershell.exe -NoProfile -File tools/build-native-contract.ps1
          if ($LASTEXITCODE -ne 0) { throw 'MSVC x64 ABI contract failed' }
          "FOCUS_CONTRACT_FILE=$env:GITHUB_WORKSPACE\out\native-contract\contract.windows.txt" >> $env:GITHUB_ENV
          "DESKFUSE_DRIVER_TEST_ABI_FILE=$env:GITHUB_WORKSPACE\out\native-contract\driver-test-abi.json" >> $env:GITHUB_ENV
      - name: Show available MSVC environment
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -products * -property installationPath
          cmake --version
      - name: Compile host and bundled production GPU DLL (never install FocusIdd)
        run: python -B tools/build-receipt.py check --name host-build --kind build --report out/provenance/host-build.json --log out/provenance/host-build.log -- dotnet build windows/agent/FocusWindow.Agent/FocusWindow.Agent.csproj -c Release -p:Platform=x64 -warnaserror
      - name: Publish standalone elevated audio broker (driver-free compile)
        run: dotnet publish windows/audio/DeskFuse.AudioBroker/DeskFuse.AudioBroker.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -warnaserror -o out/audio-broker
      - uses: actions/upload-artifact@v4
        with:
          name: deskfuse-audio-broker-x64
          path: out/audio-broker/
      - name: Compile standalone read-only taskbar audio watcher (no CMake dependency)
        run: dotnet build windows/audio/DeskFuse.TaskbarWatch/DeskFuse.TaskbarWatch.csproj -c Release -warnaserror
      - name: Compile explicit-opt-in WASAPI category probe (never run audio on CI)
        run: dotnet build windows/audio/DeskFuse.AudioCategoryProbe/DeskFuse.AudioCategoryProbe.csproj -c Release -warnaserror
      - name: Run unit and simulated tests (no display changes)
        run: python -B tools/build-receipt.py check --name host-tests --kind test --report out/provenance/host-tests.json --log out/provenance/host-tests.log -- dotnet test windows/agent/FocusWindow.Tests/FocusWindow.Tests.csproj -c Release --verbosity minimal
      - name: Restore standalone maintenance runtime pack (build dependencies only)
        run: dotnet restore windows/tools/DeskFuse.DriverTestOwner/DeskFuse.DriverTestOwner.csproj -r win-x64 -p:NuGetAudit=false
      - name: Publish self-contained maintenance owner and coordinated runner (never activate)
        run: python -B tools/build-receipt.py check --name maintenance-owner-publish --kind build --report out/provenance/maintenance-owner.json --log out/provenance/maintenance-owner.log -- powershell.exe -NoProfile -File tools/build-driver-test-owner.ps1
      - name: Test native GPU ABI and capture pacing (no hardware access)
        shell: pwsh
        run: |
          cmake --build windows/native/FocusWindow.Gpu/.build --config Release --target FocusWindow.Gpu.ContractTests
          if ($LASTEXITCODE -ne 0) { throw "Native contract test build failed" }
          ctest --test-dir windows/native/FocusWindow.Gpu/.build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "Native contract test failed" }
      - name: Publish the one Windows host with its native DLL
        run: python -B tools/build-receipt.py check --name host-publish --kind build --report out/provenance/host-publish.json --log out/provenance/host-publish.log -- dotnet publish windows/agent/FocusWindow.Agent/FocusWindow.Agent.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -warnaserror -o out/unified-windows
      - name: Verify shipping native DLL identity and exclude test runtimes
        shell: pwsh
        run: |
          $built = Get-FileHash windows/native/FocusWindow.Gpu/.build/bin/Release/FocusWindow.Gpu.dll
          $bundled = Get-FileHash out/unified-windows/FocusWindow.Gpu.dll
          if ($built.Hash -ne $bundled.Hash) { throw "Published GPU DLL differs from built DLL" }
          if (Get-ChildItem out/unified-windows -Include '*Poc*.exe','*ContractTests*.exe' -Recurse) { throw "Non-shipping test runtime in package" }
      - uses: actions/upload-artifact@v4
        with:
          name: deskfuse-windows-x64
          path: out/unified-windows/
      - name: Windows PowerShell 5.1 wrapper smoke (plan-only; no driver needed)
        run: python -B tools/build-receipt.py check --name wrapper-plan-smoke --kind test --report out/provenance/wrapper.json --log out/provenance/wrapper.log -- powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/run-dpr-challenge.ps1 -AgentExe out/unified-windows/FocusWindow.Agent.exe
      - name: Emit source-bound Windows build receipt (never installed-state proof)
        if: always()
        run: >-
          python -B tools/build-receipt.py create --baseline out/provenance/windows-source.json
          --component windows-host --profile Release --architecture x64
          --check-report out/provenance/dotnet.json --check-report out/provenance/msvc.json
          --check-report out/provenance/abi.json --check-report out/provenance/host-build.json
          --check-report out/provenance/host-tests.json --check-report out/provenance/host-publish.json
          --check-report out/provenance/wrapper.json
          --check-report out/provenance/maintenance-owner.json
          --artifact-dir out/unified-windows --artifact-dir out/audio-broker
          --artifact-dir out/driver-test-owner
          --artifact out/native-contract/contract.windows.txt --output out/provenance/windows-build.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deskfuse-windows-build-evidence
          path: out/provenance/

  android:
    name: Android DPR profile unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Snapshot source and record Android Java toolchain
        run: |
          python -B tools/build-receipt.py source --output out/provenance/android-source.json
          python -B tools/build-receipt.py check --name java-toolchain --kind toolchain --report out/provenance/java.json --log out/provenance/java.log -- java -version
      - uses: android-actions/setup-android@v3
        continue-on-error: true
      - name: Install Android SDK
        run: |
          SDK_ROOT="/usr/local/lib/android/sdk"
          MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$MANAGER"
          "$MANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
      - name: Build and test Android without devices
        run: python -B tools/build-receipt.py check --name android-build-tests --kind build --report out/provenance/android-build.json --log out/provenance/android-build.log -- bash android/gradlew -p android :app:testDebugUnitTest :app:assembleDebug :protocol3:check :protocol3:interopJar --no-daemon
      - name: Exchange encrypted records between actual Kotlin and C# implementations
        env:
          DESKFUSE_KOTLIN_INTEROP_JAR: ${{ github.workspace }}/android/build/protocol3/deskfuse-protocol-v3-kotlin.jar
        run: dotnet test windows/agent/FocusWindow.Tests/FocusWindow.Tests.csproj -c Release --filter FullyQualifiedName~ProtocolV3InteropTests --verbosity minimal
      - uses: actions/upload-artifact@v4
        with:
          name: deskfuse-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Emit Android build receipt (no device qualification)
        if: always()
        run: >-
          python -B tools/build-receipt.py create --baseline out/provenance/android-source.json
          --component android-app --profile debug --architecture arm64-v8a
          --check-report out/provenance/java.json --check-report out/provenance/android-build.json
          --artifact-dir android/app/build/outputs/apk/debug --output out/provenance/android-build-receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deskfuse-android-build-evidence
          path: out/provenance/
