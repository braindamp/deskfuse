name: Camera-free pairing checks

on:
  push:
    branches: [feature/camera-free-pairing]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pairing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows core tests and host build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build host without installing or touching display drivers
        run: dotnet build windows/agent/FocusWindow.Agent/FocusWindow.Agent.csproj -c Release -p:Platform=x64
      - name: Run software-only tests
        run: dotnet test windows/agent/FocusWindow.Tests/FocusWindow.Tests.csproj -c Release --verbosity minimal

  android:
    name: Android unit tests and debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # The runner no longer puts sdkmanager on PATH; the setup action still
      # installs cmdline-tools, but its legacy 'tools' package step can fail.
      - uses: android-actions/setup-android@v3
        continue-on-error: true
      - name: Install Android SDK 35
        run: |
          SDK_ROOT="/usr/local/lib/android/sdk"
          MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$MANAGER"
          "$MANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
      - name: Android build and unit tests
        working-directory: android
        run: bash ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
